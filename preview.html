<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Preview - BookTok</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }
    .preview-header {
      background: var(--primary);
      color: white;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: var(--shadow);
    }
    .preview-header a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .preview-header h2 {
      margin: 0;
      font-size: 1.2em;
      font-weight: 600;
    }
    .preview-frame {
      width: 100%;
      height: calc(100vh - 60px); /* full height below header */
      border: none;
      background: white;
    }
  </style>
</head>
<body>
  <div class="preview-header">
    <a href="javascript:history.back()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/>
      </svg>
      Back
    </a>
    <h2 id="book-title">Preview</h2>
  </div>

  <iframe id="preview-iframe" class="preview-frame" src="" allowfullscreen></iframe>

  <script>
    async function loadPreview() {
      const params = new URLSearchParams(window.location.search);
      const bookId = params.get('bookId');
      if (!bookId) {
        document.getElementById('book-title').textContent = 'No book specified';
        return;
      }

      try {
        // Get the preview URL from our API
        const res = await fetch(`/api/books/${bookId}/preview`);
        if (res.ok) {
          const data = await res.json();
          document.getElementById('preview-iframe').src = data.previewUrl;
          // Also set the title – we can fetch the book name separately, but for simplicity we'll just say "Preview"
          document.getElementById('book-title').textContent = 'Book Preview';
        } else {
          document.getElementById('book-title').textContent = 'Preview not available';
        }
      } catch (e) {
        document.getElementById('book-title').textContent = 'Error loading preview';
      }
    }

    loadPreview();
  </script>
</body>
</html>
