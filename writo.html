<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writo - Book Writing Studio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #f7f4ef;
      margin: 0;
      padding: 0;
      color: #3a2c1b;
    }
    .writo-header {
      background: #8b5e3c;
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    .writo-header a {
      color: white;
      text-decoration: none;
      font-weight: 600;
    }
    .writo-header h1 {
      margin: 0;
      font-size: 1.5em;
      font-weight: 700;
    }
    .writo-layout {
      display: flex;
      height: calc(100vh - 60px);
    }
    .writing-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
      margin: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      overflow: hidden;
    }
    .title-input {
      border: none;
      font-size: 2em;
      font-weight: 700;
      padding: 24px 30px;
      border-bottom: 1px solid #e0d6c8;
      background: transparent;
      color: #5a3e28;
    }
    .title-input::placeholder {
      color: #c0b09a;
    }
    .content-input {
      flex: 1;
      border: none;
      padding: 24px 30px;
      font-size: 1.1em;
      line-height: 1.8;
      resize: none;
      background: transparent;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: #3a2c1b;
    }
    .content-input::placeholder {
      color: #c0b09a;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      padding: 16px 30px;
      border-top: 1px solid #e0d6c8;
    }
    .btn {
      padding: 8px 20px;
      border-radius: 25px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-size: 0.9em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-primary { background: #8b5e3c; color: white; }
    .btn-primary:hover { background: #a47148; }
    .btn-outline { background: transparent; color: #8b5e3c; border: 2px solid #8b5e3c; }
    .btn-outline:hover { background: #f0e4ce; }
    .ai-panel {
      width: 340px;
      background: white;
      margin: 20px 20px 20px 0;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .ai-panel h2 {
      margin: 0;
      padding: 20px 24px;
      font-size: 1.2em;
      color: #5a3e28;
      border-bottom: 1px solid #e0d6c8;
    }
    .ai-chat {
      flex: 1;
      padding: 20px 24px;
      overflow-y: auto;
      background: #faf8f3;
    }
    .ai-message {
      margin-bottom: 15px;
    }
    .ai-message.user {
      text-align: right;
      color: #5a3e28;
    }
    .ai-message.writo {
      background: #f0e4ce;
      padding: 10px 15px;
      border-radius: 12px;
      color: #3a2c1b;
    }
    .ai-input-area {
      display: flex;
      gap: 8px;
      padding: 16px 24px;
      border-top: 1px solid #e0d6c8;
    }
    .ai-input-area input {
      flex: 1;
      padding: 10px 16px;
      border-radius: 25px;
      border: 1px solid #e0d6c8;
      background: white;
      font-size: 0.9em;
    }
    .load-save-area {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #writings-list {
      margin-right: 20px;
    }
  </style>
</head>
<body>
  <div class="writo-header">
    <a href="index.html" style="display:flex; align-items:center; gap:8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to BookTok
    </a>
    <h1>📝 Writo</h1>
    <div class="load-save-area">
      <select id="writings-list" style="padding:8px; border-radius:20px; border:none;">
        <option value="">New writing…</option>
      </select>
      <button class="btn btn-outline" onclick="loadWriting()" style="color:white; border-color:white;">Load</button>
      <button class="btn btn-outline" onclick="deleteWriting()" style="color:white; border-color:white;">🗑</button>
    </div>
  </div>

  <div class="writo-layout">
    <!-- Main writing area -->
    <div class="writing-area">
      <input type="text" id="writing-title" class="title-input" placeholder="Your book title…">
      <textarea id="writing-content" class="content-input" placeholder="Start writing your masterpiece…"></textarea>
      <div class="toolbar">
        <span id="word-count">Words: 0</span>
        <div>
          <button class="btn btn-outline" onclick="saveWriting()">💾 Save</button>
          <button class="btn btn-primary" onclick="aiGenerate('Write the next paragraph for this story.')">✨ Generate Next Paragraph</button>
          <button class="btn btn-outline" onclick="aiGenerate('Give me a short outline for a chapter about the current scene.')">📋 Outline Chapter</button>
        </div>
      </div>
    </div>

    <!-- AI side panel -->
    <div class="ai-panel">
      <h2>🤖 Writo AI Co‑Writer</h2>
      <div class="ai-chat" id="ai-chat">
        <div class="ai-message writo">Hi! I'm Writo, your AI writing assistant. Ask me for plot ideas, character descriptions, or help with a stuck paragraph.</div>
      </div>
      <div class="ai-input-area">
        <input type="text" id="ai-prompt" placeholder="e.g., Describe a spooky forest…">
        <button class="btn btn-primary" onclick="aiGenerateCustom()">Send</button>
      </div>
    </div>
  </div>

  <script>
    let currentWritingId = null;

    // Update word count
    setInterval(() => {
      const text = document.getElementById('writing-content').value;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      document.getElementById('word-count').textContent = `Words: ${words}`;
    }, 1000);

    // Load user's writings into the dropdown
    async function loadWritingsList() {
      const res = await fetch('/api/writings');
      const writings = await res.json();
      const list = document.getElementById('writings-list');
      writings.forEach(w => {
        const opt = document.createElement('option');
        opt.value = w.id;
        opt.textContent = w.title;
        list.appendChild(opt);
      });
    }

    // Load a selected writing
    async function loadWriting() {
      const id = document.getElementById('writings-list').value;
      if (!id) {
        // new
        document.getElementById('writing-title').value = '';
        document.getElementById('writing-content').value = '';
        currentWritingId = null;
        return;
      }
      const res = await fetch(`/api/writings/${id}`);
      if (res.ok) {
        const w = await res.json();
        document.getElementById('writing-title').value = w.title;
        document.getElementById('writing-content').value = w.content;
        currentWritingId = w.id;
      }
    }

    // Save current writing
    async function saveWriting() {
      const title = document.getElementById('writing-title').value || 'Untitled';
      const content = document.getElementById('writing-content').value;
      const body = { title, content };
      if (currentWritingId) body.id = currentWritingId;
      const res = await fetch('/api/writings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (res.ok) {
        const data = await res.json();
        if (!currentWritingId) {
          currentWritingId = data.id;
          // add to dropdown
          const list = document.getElementById('writings-list');
          const opt = document.createElement('option');
          opt.value = data.id;
          opt.textContent = title;
          list.appendChild(opt);
        }
        alert('Saved!');
      } else {
        alert('Save failed.');
      }
    }

    // Delete current writing
    async function deleteWriting() {
      if (!currentWritingId) return;
      if (!confirm('Delete this writing?')) return;
      const res = await fetch(`/api/writings/${currentWritingId}`, { method: 'DELETE' });
      if (res.ok) {
        document.getElementById('writing-title').value = '';
        document.getElementById('writing-content').value = '';
        // remove from dropdown
        const list = document.getElementById('writings-list');
        for (let i = 0; i < list.options.length; i++) {
          if (list.options[i].value == currentWritingId) {
            list.remove(i);
            break;
          }
        }
        currentWritingId = null;
        alert('Deleted.');
      }
    }

    // AI generation helper
    async function aiGenerate(prompt) {
      const content = document.getElementById('writing-content').value;
      const res = await fetch('/api/writo/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt, context: content })
      });
      const data = await res.json();
      if (data.reply) {
        // Add to chat
        addAIMessage('writo', data.reply);
        // Insert into writing area at cursor position
        const textarea = document.getElementById('writing-content');
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const before = textarea.value.substring(0, start);
        const after = textarea.value.substring(end);
        textarea.value = before + data.reply + after;
        textarea.focus();
        textarea.selectionStart = textarea.selectionEnd = start + data.reply.length;
      } else {
        addAIMessage('writo', 'Sorry, I could not generate anything.');
      }
    }

    // Custom AI interaction from the chat input
    async function aiGenerateCustom() {
      const input = document.getElementById('ai-prompt');
      const prompt = input.value.trim();
      if (!prompt) return;
      addAIMessage('user', prompt);
      input.value = '';
      const content = document.getElementById('writing-content').value;
      const res = await fetch('/api/writo/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt, context: content })
      });
      const data = await res.json();
      if (data.reply) {
        addAIMessage('writo', data.reply);
        // Also insert into writing area
        const textarea = document.getElementById('writing-content');
        textarea.value = textarea.value + '\n\n' + data.reply;
        textarea.focus();
        textarea.scrollTop = textarea.scrollHeight;
      } else {
        addAIMessage('writo', 'Oops, could not get a response.');
      }
    }

    function addAIMessage(role, text) {
      const chat = document.getElementById('ai-chat');
      const div = document.createElement('div');
      div.className = role === 'user' ? 'ai-message user' : 'ai-message writo';
      if (role === 'user') {
        div.innerHTML = `<strong>You:</strong> ${escapeHTML(text)}`;
      } else {
        div.innerHTML = `<strong>Writo:</strong> ${escapeHTML(text)}`;
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Init
    loadWritingsList();
  </script>
</body>
</html>
