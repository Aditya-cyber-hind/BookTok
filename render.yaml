services:
  - type: web
    name: booktok
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_PATH
        value: /var/data/booktok.db
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1