<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Which Book Character? - BookTok</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: var(--bg);
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      color: var(--text);
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    h1 {
      color: var(--primary);
      margin-bottom: 10px;
      font-size: 2em;
    }
    .subtitle {
      color: var(--text-light);
      margin-bottom: 25px;
    }
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 40px 20px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: all 0.3s;
      background: var(--bg);
    }
    .upload-area:hover {
      border-color: var(--primary);
      background: var(--card-bg);
    }
    .upload-area.has-image {
      border-style: solid;
      border-color: var(--primary);
      padding: 10px;
    }
    #preview-img {
      max-width: 250px;
      max-height: 250px;
      border-radius: 12px;
      display: none;
    }
    .btn {
      padding: 12px 30px;
      border-radius: 30px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-size: 1em;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .result-card {
      background: linear-gradient(135deg, #faf3e0, #f0e4ce);
      border-radius: 16px;
      padding: 25px;
      margin-top: 25px;
      display: none;
      animation: fadeInUp 0.5s ease;
    }
    .character-emoji { font-size: 4em; margin-bottom: 10px; }
    .character-name { font-size: 1.8em; font-weight: 700; color: #5a3e28; margin: 5px 0; }
    .character-book { font-size: 1.1em; color: var(--primary); }
    .character-desc { color: var(--text); margin: 15px 0; line-height: 1.6; }
    .share-btn { margin-top: 15px; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .loading-spinner {
      display: none;
      margin: 20px auto;
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Feed
    </a>
    <h1>📸 Which Book Character Do You Look Like?</h1>
    <p class="subtitle">Upload a selfie and let our AI librarian find your literary twin!</p>

    <div class="upload-area" id="upload-area" onclick="document.getElementById('photo-input').click()">
      <input type="file" id="photo-input" accept="image/*" style="display:none" onchange="previewPhoto(event)">
      <div id="upload-placeholder">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#8b5e3c" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <p style="margin-top:10px;">Click to upload a photo</p>
      </div>
      <img id="preview-img" src="" alt="Preview">
    </div>

    <button class="btn btn-primary" id="analyze-btn" onclick="analyzePhoto()" disabled>
      ✨ Find My Character Match
    </button>
    <div class="loading-spinner" id="spinner"></div>

    <div class="result-card" id="result-card">
      <div class="character-emoji" id="result-emoji"></div>
      <div class="character-name" id="result-name"></div>
      <div class="character-book" id="result-book"></div>
      <div class="character-desc" id="result-desc"></div>
      <button class="btn btn-primary share-btn" onclick="shareResult()">📢 Share to Feed</button>
    </div>
  </div>

  <script>
    let selectedFile = null;
    let currentResult = null;

    function previewPhoto(event) {
      const file = event.target.files[0];
      if (!file) return;
      selectedFile = file;
      
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById('preview-img').src = e.target.result;
        document.getElementById('preview-img').style.display = 'block';
        document.getElementById('upload-placeholder').style.display = 'none';
        document.getElementById('upload-area').classList.add('has-image');
        document.getElementById('analyze-btn').disabled = false;
      };
      reader.readAsDataURL(file);
    }

    async function analyzePhoto() {
      if (!selectedFile) return;
      
      const btn = document.getElementById('analyze-btn');
      const spinner = document.getElementById('spinner');
      const resultCard = document.getElementById('result-card');
      
      btn.disabled = true;
      btn.textContent = 'Analyzing...';
      spinner.style.display = 'block';
      resultCard.style.display = 'none';

      const formData = new FormData();
      formData.append('photo', selectedFile);

      try {
        const res = await fetch('/api/game/character-lookalike', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        
        if (data.success && data.result) {
          currentResult = data.result;
          document.getElementById('result-emoji').textContent = data.result.emoji || '📚';
          document.getElementById('result-name').textContent = data.result.character;
          document.getElementById('result-book').textContent = `From "${data.result.book}" by ${data.result.author}`;
          document.getElementById('result-desc').textContent = data.result.description;
          resultCard.style.display = 'block';
        } else {
          alert('Could not find a match. Try another photo!');
        }
      } catch (e) {
        alert('Error analyzing photo. Please try again.');
        console.error(e);
      } finally {
        btn.disabled = false;
        btn.textContent = '✨ Find My Character Match';
        spinner.style.display = 'none';
      }
    }

    async function shareResult() {
      if (!currentResult) return;
      const content = `📸 I look like **${currentResult.character}** from "${currentResult.book}" by ${currentResult.author}! ${currentResult.emoji}`;
      const res = await fetch('/api/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          content: content,
          tags: 'CharacterLookalike,BookTokGame',
          type: 'post'
        })
      });
      if (res.ok) {
        alert('Shared to feed! 📢');
      } else {
        alert('Failed to share.');
      }
    }
  </script>
</body>
</html>
