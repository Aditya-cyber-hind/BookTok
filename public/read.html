<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading - BookTok</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: var(--bg); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; color: var(--text); }
    .reader-header { background: var(--primary); color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10; flex-wrap: wrap; gap: 8px; }
    .reader-header a { color: white; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
    .reader-header h2 { margin: 0; font-size: 1.1em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; text-align: center; }
    .controls-group { display: flex; align-items: center; gap: 8px; font-size: 0.9em; flex-wrap: wrap; }
    .controls-group button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-weight: 600; white-space: nowrap; }
    .controls-group button:hover { background: rgba(255,255,255,0.35); }
    .controls-group button:disabled { opacity: 0.5; cursor: default; }
    .controls-group button.active-tts { background: #f1c40f; color: #3a2c1b; }
    .reader-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .page-content { background: #faf3e0; padding: 40px 50px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); font-family: 'Georgia', 'Times New Roman', serif; font-size: 1.15em; line-height: 1.8; color: #3a2c1b; white-space: pre-wrap; min-height: 60vh; word-wrap: break-word; }
    .page-navigation { display: flex; justify-content: space-between; align-items: center; margin: 30px 0; }
    .nav-btn { background: var(--primary); color: white; border: none; padding: 10px 28px; border-radius: 30px; font-weight: 600; cursor: pointer; font-size: 1em; }
    .nav-btn:hover { background: var(--primary-hover); }
    .nav-btn:disabled { background: #ccc; cursor: default; }
    .page-indicator { font-weight: 600; color: var(--text); }
    .loading-text { text-align: center; padding: 60px; font-size: 1.2em; color: var(--text-light); }
    body.dark .page-content { background: #2c2824; color: #ede0d4; }
  </style>
</head>
<body>
  <div class="reader-header">
    <a href="#" id="back-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg> Back</a>
    <h2 id="book-title">Loading…</h2>
    <div class="controls-group">
      <span id="timer-display">00:00:00</span>
      <button id="timer-start" onclick="startReaderTimer()">▶ Start</button>
      <button id="timer-pause" onclick="pauseReaderTimer()" disabled>⏸ Pause</button>
      <span style="color:rgba(255,255,255,0.3); margin:0 4px;">|</span>
      <button id="tts-toggle" onclick="toggleTTS()">🔊 Read Aloud</button>
    </div>
  </div>
  <div class="reader-container" id="reader-container"><div class="loading-text">Opening your book…</div></div>
  <div class="page-navigation" id="page-navigation" style="display:none;">
    <button class="nav-btn" id="prev-btn" onclick="prevPage()" disabled>← Previous</button>
    <span class="page-indicator" id="page-indicator">Page 1</span>
    <button class="nav-btn" id="next-btn" onclick="nextPage()">Next →</button>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const bookId = params.get('bookId');
    if (!bookId) { document.getElementById('book-title').textContent = 'No book specified'; document.getElementById('reader-container').innerHTML = '<p class="loading-text">No book selected.</p>'; }
    let fullText = '', pages = [], currentPage = 0;
    const CHARS_PER_PAGE = 3000;
    let timerInterval = null, readerSeconds = 0, readerSessionId = null, isSpeaking = false;
    document.getElementById('back-link').href = `book.html?id=${bookId}`;

    async function loadText() {
      try {
        const res = await fetch(`/api/books/${bookId}/text`);
        if (!res.ok) throw new Error('Full text not available');
        const data = await res.json();
        document.getElementById('book-title').textContent = data.title || 'Untitled';
        fullText = data.text || '';
        if (!fullText.trim()) throw new Error('Empty text');
        pages = [];
        for (let i = 0; i < fullText.length; i += CHARS_PER_PAGE) pages.push(fullText.substring(i, i + CHARS_PER_PAGE));
        const savedPage = localStorage.getItem(`read_progress_${bookId}`);
        currentPage = savedPage ? parseInt(savedPage) : 0;
        if (currentPage >= pages.length) currentPage = 0;
        renderPage();
        document.getElementById('page-navigation').style.display = 'flex';
      } catch (e) { document.getElementById('reader-container').innerHTML = '<p class="loading-text">This book isn\'t available for reading yet.</p>'; }
    }

    function renderPage() {
      if (pages.length === 0) return;
      document.getElementById('reader-container').innerHTML = `<div class="page-content">${pages[currentPage]}</div>`;
      document.getElementById('page-indicator').textContent = `Page ${currentPage + 1} of ${pages.length}`;
      document.getElementById('prev-btn').disabled = currentPage === 0;
      document.getElementById('next-btn').disabled = currentPage === pages.length - 1;
      localStorage.setItem(`read_progress_${bookId}`, currentPage);
      if (isSpeaking) stopSpeech();
    }

    function nextPage() { if (currentPage < pages.length - 1) { currentPage++; renderPage(); } }
    function prevPage() { if (currentPage > 0) { currentPage--; renderPage(); } }

    async function startReaderTimer() {
      if (!bookId) return;
      const res = await fetch('/api/reading-sessions', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({bookId:parseInt(bookId)}) });
      const data = await res.json();
      if (data.success) { readerSessionId = data.sessionId; readerSeconds = 0; document.getElementById('timer-start').disabled = true; document.getElementById('timer-pause').disabled = false; timerInterval = setInterval(()=>{ readerSeconds++; const h=Math.floor(readerSeconds/3600), m=Math.floor((readerSeconds%3600)/60), s=readerSeconds%60; document.getElementById('timer-display').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }, 1000); }
    }

    function pauseReaderTimer() { clearInterval(timerInterval); document.getElementById('timer-start').disabled = false; document.getElementById('timer-pause').disabled = true; }
    window.addEventListener('beforeunload', () => { if (readerSessionId && readerSeconds > 0) { fetch(`/api/reading-sessions/${readerSessionId}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({durationSeconds:readerSeconds, bookId:parseInt(bookId)}) }); } });

    function toggleTTS() { if (isSpeaking) { stopSpeech(); } else { startSpeech(); } }

    function startSpeech() {
      if (!pages.length) return;
      const div = document.createElement('div'); div.innerHTML = pages[currentPage];
      const clean = div.textContent.trim();
      if (!clean) return;
      const u = new SpeechSynthesisUtterance(clean);
      u.rate = 0.9;
      u.onstart = () => { isSpeaking = true; updateTTSButton(true); };
      u.onend = () => { isSpeaking = false; updateTTSButton(false); };
      u.onerror = (e) => { console.error('TTS error:', e); isSpeaking = false; updateTTSButton(false); };
      speechSynthesis.speak(u);
    }

    function stopSpeech() { speechSynthesis.cancel(); isSpeaking = false; updateTTSButton(false); }

    function updateTTSButton(speaking) {
      const btn = document.getElementById('tts-toggle');
      if (speaking) { btn.textContent = '⏹ Stop'; btn.classList.add('active-tts'); }
      else { btn.textContent = '🔊 Read Aloud'; btn.classList.remove('active-tts'); }
    }

    loadText();
  </script>
</body>
</html>
