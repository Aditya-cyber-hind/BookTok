<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - BookTok</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background: var(--bg); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; color: var(--text); }
    .chat-container { max-width: 700px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: var(--card-bg); }
    .chat-header { background: var(--primary); color: white; padding: 15px 20px; display: flex; align-items: center; gap: 12px; }
    .chat-header a { color: white; text-decoration: none; }
    .chat-header h2 { margin: 0; font-size: 1.1em; flex: 1; }
    .online-dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; display: none; }
    .online-dot.active { display: block; }
    .friend-list { padding: 10px; overflow-y: auto; }
    .friend-item { display: flex; align-items: center; gap: 10px; padding: 12px; cursor: pointer; border-radius: 10px; transition: background 0.2s; }
    .friend-item:hover { background: var(--bg); }
    .friend-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; object-fit: cover; }
    #chat-area { display: none; flex: 1; flex-direction: column; }
    .messages-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 18px; line-height: 1.4; animation: fadeIn 0.3s ease; word-wrap: break-word; }
    .msg.sent { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 4px; }
    .msg.received { align-self: flex-start; background: var(--accent); color: #3a2c1b; border-bottom-left-radius: 4px; }
    .msg-time { font-size: 0.65em; opacity: 0.7; margin-top: 4px; }
    .input-area { display: flex; gap: 8px; padding: 12px 15px; border-top: 1px solid var(--border); background: var(--card-bg); }
    .input-area input { flex: 1; padding: 10px 16px; border-radius: 25px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    .input-area button { background: var(--primary); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.2em; }
    .no-chat { text-align: center; color: var(--text-light); padding: 40px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <a href="index.html" style="display:none;" class="back-btn-main">←</a>
      <a href="#" id="friend-list-back" style="display:none;">←</a>
      <img id="chat-avatar" src="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;display:none;">
      <div class="online-dot" id="online-dot"></div>
      <h2 id="chat-title">Messages</h2>
    </div>

    <div id="friend-list" class="friend-list"></div>
    <div id="chat-area">
      <div class="messages-area" id="messages"></div>
      <div class="input-area">
        <input type="text" id="message-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let currentChat = null;
    let socket = null;

    async function init() {
      const me = await fetch('/api/me');
      if (!me.ok) { window.location.href = 'index.html'; return; }
      currentUser = await me.json();

      socket = io();
      socket.emit('user-online', currentUser.id);

      socket.on('private-message', (data) => {
        if (currentChat && (data.from === currentChat.id || data.own)) {
          appendMessage(data.message, data.own ? 'sent' : 'received', data.timestamp);
        }
      });

      loadFriends();
    }

    async function loadFriends() {
      const res = await fetch('/api/friends');
      const friends = await res.json();
      const container = document.getElementById('friend-list');
      if (!friends.length) {
        container.innerHTML = '<div class="no-chat">No friends yet. Add friends from the feed!</div>';
        return;
      }
      container.innerHTML = friends.map(f => {
        const avatarUrl = `https://api.dicebear.com/9.x/adventurer/svg?seed=${encodeURIComponent(f.username)}`;
        return `
        <div class="friend-item" onclick="openChat(${f.id}, '${escapeHTML(f.username)}')">
          <img class="friend-avatar" src="${avatarUrl}" alt="${escapeHTML(f.username)}" onerror="this.style.display='none'">
          <div>
            <div style="font-weight:600;">${escapeHTML(f.username)}</div>
            <div style="font-size:0.75em; color:var(--text-light);">Tap to chat</div>
          </div>
        </div>
        `;
      }).join('');
    }

    async function openChat(friendId, friendName) {
      currentChat = { id: friendId, name: friendName };
      
      // Get friend's profile pic
      try {
        const profileRes = await fetch(`/api/profile/${friendId}`);
        const profileData = await profileRes.json();
        let avatarUrl = `https://api.dicebear.com/9.x/adventurer/svg?seed=${encodeURIComponent(friendName)}`;
        if (profileData.user) {
          if (profileData.user.profile_pic_url) {
            avatarUrl = profileData.user.profile_pic_url;
          } else if (profileData.avatar_seed) {
            avatarUrl = `https://api.dicebear.com/9.x/${profileData.avatar_style || 'adventurer'}/svg?seed=${encodeURIComponent(profileData.avatar_seed)}`;
          }
        }
        document.getElementById('chat-avatar').src = avatarUrl;
      } catch(e) {
        document.getElementById('chat-avatar').src = `https://api.dicebear.com/9.x/adventurer/svg?seed=${encodeURIComponent(friendName)}`;
      }
      
      document.getElementById('friend-list').style.display = 'none';
      document.getElementById('chat-area').style.display = 'flex';
      document.getElementById('chat-title').textContent = friendName;
      document.getElementById('friend-list-back').style.display = 'inline';
      document.querySelector('.back-btn-main').style.display = 'none';
      document.getElementById('chat-avatar').style.display = 'inline';

      const res = await fetch(`/api/chat/${friendId}`);
      const messages = await res.json();
      document.getElementById('messages').innerHTML = '';
      messages.forEach(m => {
        appendMessage(m.content, m.from_id === currentUser.id ? 'sent' : 'received', m.sent_at);
      });
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const message = input.value.trim();
      if (!message || !currentChat) return;

      socket.emit('private-message', { to: currentChat.id, message });
      input.value = '';
    }

    function appendMessage(text, type, timestamp) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      const time = timestamp ? new Date(timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      div.innerHTML = `${escapeHTML(text)}<div class="msg-time">${time}</div>`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('friend-list-back').addEventListener('click', () => {
      currentChat = null;
      document.getElementById('friend-list').style.display = 'block';
      document.getElementById('chat-area').style.display = 'none';
      document.getElementById('chat-title').textContent = 'Messages';
      document.getElementById('friend-list-back').style.display = 'none';
      document.getElementById('chat-avatar').style.display = 'none';
      document.querySelector('.back-btn-main').style.display = 'inline';
    });

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    init();
  </script>
</body>
</html>
