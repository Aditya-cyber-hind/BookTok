<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shorts - BookTok</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: linear-gradient(180deg, #1a1410 0%, #2c1f14 30%, #3a2618 60%, #1a1410 100%);
      font-family: 'Inter', 'Segoe UI', sans-serif; 
      height: 100vh; 
      overflow: hidden;
      overscroll-behavior-y: contain;
      -webkit-font-smoothing: antialiased;
    }
    
    .shorts-viewport { 
      width: 100%; 
      max-width: 500px; 
      height: 100vh; 
      margin: 0 auto; 
      position: relative; 
      overflow-y: scroll; 
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .shorts-viewport::-webkit-scrollbar { display: none; }
    
    .short-item { 
      width: 100%; 
      height: 100vh; 
      scroll-snap-align: start; 
      position: relative; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background: linear-gradient(135deg, #2a1a0c 0%, #3d2613 50%, #1a0f06 100%);
      cursor: pointer;
    }
    .short-item::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      height: 85%;
      background: radial-gradient(ellipse, rgba(180, 130, 80, 0.15) 0%, transparent 70%);
      z-index: 1;
      pointer-events: none;
      border-radius: 20px;
    }
    .short-item video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      position: absolute;
      top: 0; left: 0;
      z-index: 2;
    }
    .short-item img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      position: absolute;
      top: 0; left: 0;
      z-index: 2;
    }

    /* Gradient overlays */
    .short-overlay-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(to bottom, rgba(26,20,16,0.7), transparent);
      z-index: 5;
      pointer-events: none;
    }
    .short-overlay-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 200px;
      background: linear-gradient(to top, rgba(26,20,16,0.8) 30%, transparent);
      z-index: 5;
      pointer-events: none;
    }

    /* Pause overlay */
    .pause-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 80px; height: 80px;
      background: rgba(139,94,60,0.7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 15;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .pause-overlay.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      animation: pausePopIn 0.3s ease;
    }
    .pause-overlay.hide {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.5);
    }
    @keyframes pausePopIn {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      70% { transform: translate(-50%, -50%) scale(1.1); }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .pause-icon {
      color: white;
      font-size: 2em;
      font-weight: 700;
    }

    /* Header */
    .shorts-header {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      z-index: 20;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .shorts-header-tabs {
      display: flex;
      gap: 4px;
      background: rgba(139,94,60,0.2);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      padding: 4px;
      border: 1px solid rgba(180,130,80,0.3);
    }
    .shorts-tab {
      padding: 8px 18px;
      border-radius: 25px;
      font-size: 0.8em;
      font-weight: 600;
      color: #d4a373;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .shorts-tab.active {
      background: #8b5e3c;
      color: white;
      box-shadow: 0 2px 8px rgba(139,94,60,0.4);
    }
    .shorts-back {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9em;
      background: rgba(139,94,60,0.3);
      backdrop-filter: blur(20px);
      padding: 8px 14px;
      border-radius: 25px;
      border: 1px solid rgba(180,130,80,0.3);
    }

    /* Side actions */
    .side-actions { 
      position: absolute; 
      right: 14px; 
      bottom: 160px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 22px; 
      z-index: 10;
    }
    .side-btn { 
      background: none; 
      border: none; 
      cursor: pointer; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 4px;
      transition: transform 0.15s ease;
    }
    .side-btn:active { transform: scale(0.85); }
    .side-btn svg { 
      width: 30px; 
      height: 30px; 
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      transition: all 0.2s;
    }
    .side-btn span { 
      color: #ede0d4; 
      font-size: 0.7em; 
      font-weight: 700; 
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    }
    .like-btn.liked svg { 
      fill: #e74c3c;
      stroke: #e74c3c;
      animation: heartPop 0.4s ease;
    }
    @keyframes heartPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    /* Bottom info */
    .bottom-info { 
      position: absolute; 
      bottom: 20px; 
      left: 16px; 
      right: 70px; 
      z-index: 10;
    }
    .bottom-user {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .bottom-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 2px solid #d4a373;
      object-fit: cover;
      background: #8b5e3c;
    }
    .bottom-username { 
      color: #ede0d4; 
      font-weight: 700; 
      font-size: 0.95em; 
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .bottom-caption { 
      color: rgba(237,224,212,0.9); 
      font-size: 0.82em; 
      line-height: 1.5;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Upload button */
    .upload-fab {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: linear-gradient(135deg, #8b5e3c, #a47148);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.9em;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(139,94,60,0.5);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .upload-fab:hover {
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 8px 30px rgba(139,94,60,0.7);
    }
    .upload-fab:active { transform: translateX(-50%) scale(0.95); }

    /* Comment sheet */
    .comment-sheet { 
      position: absolute; 
      bottom: 0; left: 0; right: 0; 
      background: rgba(30,20,12,0.97); 
      backdrop-filter: blur(20px);
      border-radius: 20px 20px 0 0; 
      border-top: 1px solid rgba(180,130,80,0.3);
      padding: 24px; 
      z-index: 30; 
      display: none; 
      max-height: 55%; 
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .comment-sheet h3 { 
      color: #ede0d4; 
      margin-bottom: 16px; 
      font-size: 1em;
    }
    .comment-sheet input { 
      width: 100%; 
      padding: 12px 16px; 
      border-radius: 25px; 
      border: 1px solid rgba(180,130,80,0.3); 
      background: rgba(139,94,60,0.15); 
      color: #ede0d4; 
      margin-bottom: 12px;
      font-size: 0.9em;
    }
    .comment-sheet input::placeholder { color: rgba(237,224,212,0.4); }
    .comment-item { 
      color: rgba(237,224,212,0.85); 
      padding: 10px 0; 
      border-bottom: 1px solid rgba(180,130,80,0.1); 
      font-size: 0.85em;
      display: flex;
      gap: 8px;
    }
    .comment-item strong { 
      color: #d4a373; 
      font-weight: 600;
      white-space: nowrap;
    }
    .close-sheet { 
      position: absolute; 
      top: 16px; right: 20px; 
      background: rgba(139,94,60,0.3); 
      border: none; color: #ede0d4; 
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Empty state */
    .empty-state { 
      height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      color: #c49a6c; 
      font-size: 1em;
      flex-direction: column; 
      gap: 12px;
      text-align: center;
      padding: 20px;
    }

    @media (min-width: 769px) {
      .shorts-viewport {
        border-left: 1px solid rgba(180,130,80,0.2);
        border-right: 1px solid rgba(180,130,80,0.2);
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="shorts-header">
    <a href="index.html" class="shorts-back">← Feed</a>
    <div class="shorts-header-tabs">
      <button class="shorts-tab active">For You</button>
      <button class="shorts-tab">Following</button>
    </div>
    <div style="width:50px;"></div>
  </div>

  <!-- Viewport -->
  <div class="shorts-viewport" id="shorts-viewport">
    <div class="empty-state">
      <div style="font-size:3em;">📱</div>
      <div>Loading shorts...</div>
    </div>
  </div>

  <!-- Upload FAB -->
  <button class="upload-fab" onclick="document.getElementById('short-upload').click()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Upload Short
  </button>
  <input type="file" id="short-upload" accept="video/*" style="display:none" onchange="uploadShort()">

  <script>
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const me = await fetch('/api/me');
      if (me.ok) currentUser = await me.json();
      loadShorts();
    });

    async function loadShorts() {
      const viewport = document.getElementById('shorts-viewport');
      try {
        const res = await fetch('/api/shorts');
        const shorts = await res.json();
        
        if (!shorts.length) {
          viewport.innerHTML = `
            <div class="empty-state">
              <div style="font-size:4em;">📱</div>
              <div style="font-weight:600;">No shorts yet</div>
              <div style="color:#c49a6c;font-size:0.85em;">Be the first to upload a book short!</div>
            </div>`;
          return;
        }

        viewport.innerHTML = shorts.map((s, index) => {
          const isOwner = currentUser && currentUser.id === s.author_id;
          const isVideo = s.media_url?.match(/\.(mp4|webm|ogg)$/i);
          const avatarUrl = `https://api.dicebear.com/9.x/adventurer/svg?seed=${encodeURIComponent(s.username)}`;
          
          return `
            <div class="short-item" id="short-${s.id}">
              <div class="short-overlay-top"></div>
              <div class="short-overlay-bottom"></div>
              
              ${isVideo
                ? `<video src="${s.media_url}" loop playsinline id="video-${s.id}" muted preload="metadata"></video>`
                : s.media_url
                  ? `<img src="${s.media_url}" alt="">`
                  : '<div style="color:#d4a373;text-align:center;z-index:3;">📖</div>'}
              
              <div class="side-actions">
                <button class="side-btn like-btn ${s.liked ? 'liked' : ''}" onclick="event.stopPropagation(); toggleLike(${s.id}, this)">
                  <svg viewBox="0 0 24 24" fill="${s.liked ? '#e74c3c' : 'none'}" stroke="white" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                  </svg>
                  <span>${s.like_count || 0}</span>
                </button>
                <button class="side-btn" onclick="event.stopPropagation(); openComments(${s.id})">
                  <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                  </svg>
                  <span>Comment</span>
                </button>
                <button class="side-btn" onclick="event.stopPropagation(); shareShort(${s.id})">
                  <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                  </svg>
                  <span>Share</span>
                </button>
                ${isOwner ? `
                <button class="side-btn" onclick="event.stopPropagation(); deleteShort(${s.id})" style="margin-top:10px;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                  </svg>
                </button>` : ''}
              </div>
              
              <div class="bottom-info">
                <div class="bottom-user">
                  <img class="bottom-avatar" src="${avatarUrl}" alt="${escapeHTML(s.username)}">
                  <span class="bottom-username">@${escapeHTML(s.username)}</span>
                </div>
                <div class="bottom-caption">${escapeHTML(s.content?.substring(0, 200) || '📖 Book short')}</div>
              </div>
              
              <div class="comment-sheet" id="sheet-${s.id}">
                <button class="close-sheet" onclick="closeComments(${s.id})">✕</button>
                <h3>💬 Comments</h3>
                <input type="text" id="comment-input-${s.id}" placeholder="Add a comment..." onkeypress="if(event.key==='Enter')postComment(${s.id})">
                <div id="comments-list-${s.id}"></div>
              </div>
            </div>
          `;
        }).join('');

        setupVideoObserver();
      } catch (err) {
        viewport.innerHTML = '<div class="empty-state">Could not load shorts.</div>';
      }
    }

    function setupVideoObserver() {
      const items = document.querySelectorAll('.short-item');
      if (!items.length) return;

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('video');
          if (!video) return;
          
          if (entry.isIntersecting) {
            video.currentTime = 0;
            video.muted = false;
            video.volume = 1.0;
            video.play().catch(() => {});
          } else {
            video.pause();
            video.muted = true;
          }
        });
      }, { threshold: 0.7 });

      items.forEach(item => observer.observe(item));
    }

    // Click to play/pause with animation
    document.addEventListener('click', (e) => {
      const video = e.target.closest('video');
      if (video) {
        const item = video.closest('.short-item');
        let overlay = item.querySelector('.pause-overlay');
        
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.className = 'pause-overlay';
          overlay.innerHTML = '<span class="pause-icon">⏸</span>';
          item.appendChild(overlay);
        }
        
        if (video.paused) {
          video.muted = false;
          video.volume = 1.0;
          video.play().catch(() => {});
          overlay.classList.remove('show');
          overlay.classList.add('hide');
        } else {
          video.pause();
          overlay.innerHTML = '<span class="pause-icon">▶</span>';
          overlay.classList.remove('hide');
          overlay.classList.add('show');
          setTimeout(() => {
            if (video.paused) {
              overlay.classList.remove('show');
              overlay.classList.add('hide');
            }
          }, 800);
        }
      }
    });

    // Arrow key navigation
    document.addEventListener('keydown', (e) => {
      const viewport = document.getElementById('shorts-viewport');
      const items = document.querySelectorAll('.short-item');
      if (!items.length) return;
      
      let currentIndex = 0;
      items.forEach((item, i) => {
        const rect = item.getBoundingClientRect();
        const itemCenter = rect.top + rect.height / 2;
        if (Math.abs(itemCenter - window.innerHeight / 2) < window.innerHeight / 2) {
          currentIndex = i;
        }
      });
      
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        if (currentIndex < items.length - 1) {
          items[currentIndex + 1].scrollIntoView({ behavior: 'smooth' });
        }
      } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        if (currentIndex > 0) {
          items[currentIndex - 1].scrollIntoView({ behavior: 'smooth' });
        }
      } else if (e.key === ' ') {
        e.preventDefault();
        const video = items[currentIndex]?.querySelector('video');
        if (video) {
          const item = video.closest('.short-item');
          let overlay = item.querySelector('.pause-overlay');
          if (!overlay) {
            overlay = document.createElement('div');
            overlay.className = 'pause-overlay';
            overlay.innerHTML = '<span class="pause-icon">⏸</span>';
            item.appendChild(overlay);
          }
          
          if (video.paused) {
            video.play();
            overlay.classList.remove('show');
            overlay.classList.add('hide');
          } else {
            video.pause();
            overlay.innerHTML = '<span class="pause-icon">▶</span>';
            overlay.classList.remove('hide');
            overlay.classList.add('show');
            setTimeout(() => {
              if (video.paused) {
                overlay.classList.remove('show');
                overlay.classList.add('hide');
              }
            }, 800);
          }
        }
      }
    });

    async function toggleLike(postId, btn) {
      await fetch('/api/like', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ postId })
      });
      
      const svg = btn.querySelector('svg');
      const span = btn.querySelector('span');
      const currentLikes = parseInt(span.textContent) || 0;
      
      if (btn.classList.contains('liked')) {
        btn.classList.remove('liked');
        svg.setAttribute('fill', 'none');
        span.textContent = Math.max(0, currentLikes - 1);
      } else {
        btn.classList.add('liked');
        svg.setAttribute('fill', '#e74c3c');
        span.textContent = currentLikes + 1;
      }
    }

    async function openComments(postId) {
      const sheet = document.getElementById(`sheet-${postId}`);
      if (!sheet) return;
      sheet.style.display = 'block';
      
      const res = await fetch(`/api/posts/${postId}/comments`);
      const comments = await res.json();
      const list = document.getElementById(`comments-list-${postId}`);
      if (!list) return;
      list.innerHTML = comments.map(c => `
        <div class="comment-item">
          <strong>${escapeHTML(c.username)}</strong>
          <span>${escapeHTML(c.content)}</span>
        </div>
      `).join('') || '<p style="color:#888;font-size:0.85em;">No comments yet.</p>';
    }

    function closeComments(postId) {
      const sheet = document.getElementById(`sheet-${postId}`);
      if (sheet) sheet.style.display = 'none';
    }

    async function postComment(postId) {
      const input = document.getElementById(`comment-input-${postId}`);
      if (!input) return;
      const content = input.value.trim();
      if (!content) return;
      
      await fetch(`/api/posts/${postId}/comments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });
      input.value = '';
      openComments(postId);
    }

    async function deleteShort(postId) {
      if (!confirm('Delete this short?')) return;
      await fetch(`/api/posts/${postId}`, { method: 'DELETE' });
      loadShorts();
    }

    function shareShort(postId) {
      const url = `${window.location.origin}/shorts.html#short-${postId}`;
      if (navigator.share) {
        navigator.share({ title: 'BookTok Short', url });
      } else {
        navigator.clipboard.writeText(url);
        alert('Link copied!');
      }
    }

    async function uploadShort() {
      const file = document.getElementById('short-upload').files[0];
      if (!file) return;
      
      const formData = new FormData();
      formData.append('content', '');
      formData.append('type', 'short');
      formData.append('isShort', 'true');
      formData.append('media', file);
      
      await fetch('/api/posts', { method: 'POST', body: formData });
      document.getElementById('short-upload').value = '';
      loadShorts();
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }
  </script>
</body>
</html>
