<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trending - BookTok</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 8px;
      border-bottom: 1px solid var(--border);
    }
    a {
      color: var(--primary);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 15px;
      color: var(--primary);
      font-weight: 600;
    }
    h1 {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
      margin-bottom: 20px;
    }
    h2 {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.2em;
      margin: 20px 0 10px;
      color: var(--text);
    }
    #trending-posts div,
    #trending-books div,
    #trending-reviewers div {
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg);
      padding: 4px 12px;
      border-radius: 20px;
      margin: 3px;
      font-size: 0.9em;
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
    }
    .tag-pill:hover {
      background: var(--accent);
      color: #3a2c1b;
    }
    /* SVG icons */
    svg.icon {
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Back link with custom arrow -->
    <a href="index.html" class="back-link">
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      Back
    </a>

    <!-- Title with custom fire icon -->
    <h1>
      <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2 1.5-3.5 0-2.8-2.2-5-5-5-1.4 0-2.8.4-3.8 1.2C7.8 5.4 6 8 6 11c0 3.5 2.3 6.4 5.5 7.5"/><polygon points="10,22 8,12 14,18 12,10 16,12 14,8"/></svg>
      Trending
    </h1>

    <!-- Most Liked Posts -->
    <h2>
      <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      Most Liked Posts
    </h2>
    <div id="trending-posts"></div>

    <!-- Most Want‑to‑Read Books -->
    <h2>
      <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
      Most Want‑to‑Read Books
    </h2>
    <div id="trending-books"></div>

    <!-- Top Reviewers -->
    <h2>
      <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Top Reviewers
    </h2>
    <div id="trending-reviewers"></div>

    <!-- Trending Tags -->
    <h2>
      <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-3.0-3.0L17.6 10.4a4 4 0 0 0-5.66-5.66L4.77 11.91a2 2 0 0 0 2.83 2.83l7.08-7.08"/></svg>
      Trending Tags
    </h2>
    <div id="trending-tags"></div>
  </div>

  <script>
    async function loadTrending() {
      const [postsRes, booksRes, reviewersRes, tagsRes] = await Promise.all([
        fetch('/api/trending/posts'),
        fetch('/api/trending/books'),
        fetch('/api/trending/reviewers'),
        fetch('/api/trending/tags')
      ]);
      const posts = await postsRes.json();
      const books = await booksRes.json();
      const reviewers = await reviewersRes.json();
      const tags = await tagsRes.json();

      document.getElementById('trending-posts').innerHTML = posts.map(p =>
        `<div><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b5e3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> ${p.like_count} – <a href="profile.html?id=${p.author_id}">${escapeHTML(p.username)}</a>: ${escapeHTML(p.content)}</div>`
      ).join('') || '<p>No posts this week.</p>';

      document.getElementById('trending-books').innerHTML = books.map(b =>
        `<div><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b5e3c" stroke-width="2" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg> <a href="book.html?id=${b.id}">${escapeHTML(b.title)}</a> by ${escapeHTML(b.author)} – ${b.count} readers</div>`
      ).join('') || '<p>No data yet.</p>';

      document.getElementById('trending-reviewers').innerHTML = reviewers.map(r =>
        `<div><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b5e3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> <a href="profile.html?id=${r.id}">${escapeHTML(r.username)}</a> – ${r.count} reviews</div>`
      ).join('') || '<p>No reviews yet.</p>';

      document.getElementById('trending-tags').innerHTML = tags.length
        ? tags.map(t => `<a href="tags.html?tag=${encodeURIComponent(t.tag)}" class="tag-pill"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-3.0-3.0L17.6 10.4a4 4 0 0 0-5.66-5.66L4.77 11.91a2 2 0 0 0 2.83 2.83l7.08-7.08"/></svg> #${escapeHTML(t.tag)} (${t.count})</a>`).join('')
        : '<p>No trending tags this week.</p>';
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    loadTrending();
  </script>
</body>
</html>
