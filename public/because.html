<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Because You Liked… - BookTok</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    h1 {
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tag-section {
      margin: 25px 0;
    }
    .tag-section h2 {
      font-size: 1.3em;
      color: var(--accent);
      margin-bottom: 10px;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .book-card, .post-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin: 8px 0;
    }
    .book-card a, .post-card a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .post-card .author a { font-size: 0.9em; color: var(--text-light); }
    .post-card .tags { font-size: 0.85em; color: var(--accent); margin-top: 5px; }
    .post-card .content { margin: 5px 0; }
    .post-card img, .post-card video { max-width: 100%; border-radius: 6px; margin-top: 5px; }
    .book-card .book-info { display: flex; gap: 12px; align-items: center; }
    .book-card .book-info img { width: 50px; height: 70px; object-fit: cover; border-radius: 4px; background: var(--border); }
    .empty-message { text-align: center; padding: 30px; color: var(--text-light); }
    /* SVG icons */
    svg.icon { flex-shrink: 0; }
    .tag-section h2 svg { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <!-- Custom back arrow -->
    <a href="index.html" class="back-link">
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Feed
    </a>

    <!-- Title with custom lightbulb -->
    <h1>
      <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8b5e3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2 1.5-3.5A6 6 0 0 0 6 8c0 1 .4 2.1 1 3 1 1.3 1.7 2.2 2 3.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
      Because You Liked…
    </h1>

    <div id="because-content">Loading your personal picks…</div>
  </div>

  <script>
    async function loadBecause() {
      const res = await fetch('/api/because');
      const data = await res.json();
      const container = document.getElementById('because-content');
      container.innerHTML = '';

      // 1. Recommended for You (with custom book icon)
      if (data.recommendedBooks && data.recommendedBooks.length) {
        container.innerHTML += `<div class="tag-section"><h2>
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
          Recommended for You</h2>${renderBooks(data.recommendedBooks)}</div>`;
      }

      // 2. Because of Your Likes (with heart/book icon)
      if (data.tagBooks && data.tagBooks.length) {
        container.innerHTML += `<div class="tag-section"><h2>
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
          Because of Your Likes</h2>${renderBooks(data.tagBooks)}</div>`;
      }

      // 3. Trending Posts (with custom fire icon)
      if (data.trendingPosts && data.trendingPosts.length) {
        container.innerHTML += `<div class="tag-section"><h2>
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2 1.5-3.5 0-2.8-2.2-5-5-5-1.4 0-2.8.4-3.8 1.2C7.8 5.4 6 8 6 11c0 3.5 2.3 6.4 5.5 7.5"/><polygon points="10,22 8,12 14,18 12,10 16,12 14,8"/></svg>
          Trending Posts</h2>${data.trendingPosts.map(renderPost).join('')}</div>`;
      }

      // 4. Because you liked #tag…
      if (data.tags && data.tags.length && data.tagPosts && data.tagPosts.length) {
        data.tags.forEach(tag => {
          const tagPosts = data.tagPosts.filter(p => p.tags && p.tags.includes(tag));
          if (tagPosts.length === 0) return;
          container.innerHTML += `
            <div class="tag-section">
              <h2>
                <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-3.0-3.0L17.6 10.4a4 4 0 0 0-5.66-5.66L4.77 11.91a2 2 0 0 0 2.83 2.83l7.08-7.08"/></svg>
                Because you liked #${escapeHTML(tag)}…
              </h2>
              ${tagPosts.map(renderPost).join('')}
            </div>
          `;
        });
      }

      if (container.innerHTML === '') {
        container.innerHTML = '<p class="empty-message">Explore the feed and like some posts to get personalised recommendations!</p>';
      }
    }

    function renderBooks(books) {
      return books.map(book => `
        <div class="book-card">
          <div class="book-info">
            ${book.cover_url ? `<img src="${book.cover_url}" alt="${escapeHTML(book.title)}" onerror="this.style.display='none'">` : `
            <div class="no-cover" style="width:50px;height:70px;background:var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:20px;">
              <!-- Custom book icon for missing cover -->
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8b5e3c" stroke-width="2" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
            </div>`}
            <div>
              <a href="book.html?id=${book.id}">${escapeHTML(book.title)}</a>
              <div style="font-size:0.9em;">by ${escapeHTML(book.author)} (${escapeHTML(book.genre)})</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderPost(post) {
      let mediaHTML = '';
      if (post.media_url) {
        const ext = post.media_url.split('.').pop().toLowerCase();
        if (['mp4','webm','ogg'].includes(ext)) {
          mediaHTML = `<video controls src="${post.media_url}"></video>`;
        } else {
          mediaHTML = `<img src="${post.media_url}" alt="post media" />`;
        }
      }
      return `
        <div class="post-card">
          <div class="author"><a href="profile.html?id=${post.author_id}">${escapeHTML(post.username)}</a></div>
          <div class="content">${escapeHTML(post.content)}</div>
          <div class="tags">${post.tags.map(t => `#${escapeHTML(t)}`).join(' ')}</div>
          ${mediaHTML}
          <div style="font-size:0.8em; color:var(--text-light); display:flex; align-items:center; gap:4px;">
            <!-- Heart icon for likes -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            ${post.like_count}
          </div>
        </div>
      `;
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    loadBecause();
  </script>
</body>
</html>
