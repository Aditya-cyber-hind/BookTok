<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details - BookTok</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f7f4ef;
      color: #3a2c1b;
      padding: 0;
      margin: 0;
    }
    .container {
      max-width: 860px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #8b5e3c;
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 25px;
      font-size: 0.95em;
    }
    .book-hero {
      display: flex;
      gap: 30px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .book-cover {
      width: 160px;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }
    .book-cover-placeholder {
      width: 160px;
      height: 220px;
      background: #e0d6c8;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3em;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }
    .book-info {
      flex: 1;
    }
    .book-info h1 {
      margin: 0 0 8px;
      font-size: 2em;
      font-weight: 700;
      color: #5a3e28;
    }
    .book-info .author {
      font-size: 1.1em;
      color: #6b5d4f;
      margin-bottom: 10px;
    }
    .meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    .tag {
      background: #f0e4ce;
      color: #5a3e28;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 500;
    }
    .rating-badge {
      background: #f9f3e0;
      color: #8b5e3c;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .actions {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
      font-size: 0.95em;
    }
    .btn-primary {
      background: #8b5e3c;
      color: white;
    }
    .btn-primary:hover { background: #a47148; transform: translateY(-1px); }
    .btn-outline {
      background: transparent;
      color: #8b5e3c;
      border: 2px solid #8b5e3c;
    }
    .btn-outline:hover { background: #f0e4ce; }
    .unavailable-note {
      background: #faf5e6;
      border: 1px solid #e0d6c8;
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #5a3e28;
      margin-top: 15px;
    }
    .section-card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }
    .section-card h3 {
      margin: 0 0 15px;
      font-size: 1.25em;
      color: #5a3e28;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .status-btn {
      padding: 8px 18px;
      border-radius: 25px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      background: #e0d6c8;
      color: #5a3e28;
      transition: all 0.2s;
    }
    .status-btn.active {
      background: #8b5e3c;
      color: white;
    }
    .progress-inputs {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .progress-inputs input {
      width: 80px;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #e0d6c8;
      background: #faf5e6;
    }
    .timer-display {
      font-size: 2.5em;
      font-weight: 700;
      color: #5a3e28;
      margin: 10px 0;
      font-variant-numeric: tabular-nums;
    }
    .timer-btns {
      display: flex;
      gap: 10px;
    }
    .stars {
      display: flex;
      gap: 6px;
      font-size: 2em;
      cursor: pointer;
      color: #e0d6c8;
      transition: color 0.2s;
    }
    .stars .star.active { color: #f1c40f; }
    .review-card {
      background: #f9f7f2;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #e0d6c8;
    }
    .review-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .review-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #d4a373;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
    }
    .review-text {
      color: #3a2c1b;
      line-height: 1.5;
    }
    .review-time {
      font-size: 0.8em;
      color: #9b8c7c;
    }
    textarea {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #e0d6c8;
      padding: 12px;
      font-family: inherit;
      background: #faf5e6;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="books.html" class="back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Explore
    </a>

    <div class="book-hero" id="book-hero">
      <!-- filled by JS -->
    </div>

    <div class="section-card">
      <h3>📖 My Reading Status</h3>
      <div class="status-btns" id="status-btns">
        <button class="status-btn" data-status="want_to_read" onclick="setStatus('want_to_read')">📌 Want to Read</button>
        <button class="status-btn" data-status="currently_reading" onclick="setStatus('currently_reading')">📖 Currently Reading</button>
        <button class="status-btn" data-status="finished" onclick="setStatus('finished')">✅ Finished</button>
      </div>
      <div id="progress-section" style="display:none;" class="progress-inputs">
        <input type="number" id="pages-read" placeholder="Pages read">
        <span>/</span>
        <input type="number" id="total-pages" placeholder="Total pages">
        <button class="btn btn-primary" onclick="updateProgress()">Update Progress</button>
      </div>
    </div>

    <div class="section-card">
      <h3>⏱️ Reading Timer</h3>
      <div class="timer-display" id="timer-display">00:00:00</div>
      <div class="timer-btns">
        <button class="btn btn-primary" id="timer-start" onclick="startTimer()">▶ Start</button>
        <button class="btn btn-outline" id="timer-pause" onclick="pauseTimer()" disabled>⏸ Pause</button>
        <button class="btn btn-outline" id="timer-stop" onclick="stopTimer()" disabled>⏹ Stop & Save</button>
      </div>
    </div>

    <div class="section-card">
      <h3>⭐ Rate & Review</h3>
      <div class="stars" id="rating-stars">
        <span onclick="setRating(1)">☆</span>
        <span onclick="setRating(2)">☆</span>
        <span onclick="setRating(3)">☆</span>
        <span onclick="setRating(4)">☆</span>
        <span onclick="setRating(5)">☆</span>
      </div>
      <textarea id="review-text" rows="3" placeholder="What did you think of this book?" style="margin:15px 0;"></textarea>
      <button class="btn btn-primary" onclick="submitReview()">Submit Review</button>
    </div>

    <div class="section-card">
      <h3>📝 Reviews</h3>
      <div id="reviews-list"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const bookId = params.get('id');
    if (!bookId) window.location.href = 'books.html';

    let myRating = 0;
    let myCurrentStatus = 'want_to_read';
    let myProgress = 0, myTotal = null;
    let timerInterval = null;
    let secondsElapsed = 0;
    let currentSessionId = null;

    async function loadBook() {
      const res = await fetch(`/api/books/${bookId}`);
      if (!res.ok) {
        document.getElementById('book-hero').innerHTML = '<p>Book not found.</p>';
        return;
      }
      const book = await res.json();
      const avg = book.avg_rating ? `⭐ ${book.avg_rating} (${book.review_count} reviews)` : 'No ratings yet';

      // ---------- Google Books thumbnail cover ----------
      const coverUrl = book.google_books_id
        ? `https://books.google.com/books/content?id=${book.google_books_id}&printsec=frontcover&img=1&zoom=2&source=gbs_api`
        : null;

      let coverHTML = '';
      if (coverUrl) {
        coverHTML = `<img src="${coverUrl}" alt="${escapeHTML(book.title)} cover" class="book-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">`;
      }
      coverHTML += `<div class="book-cover-placeholder" style="display:${coverUrl ? 'none' : 'flex'};">📖</div>`;
      // ------------------------------------------------

      document.getElementById('book-hero').innerHTML = `
        ${coverHTML}
        <div class="book-info">
          <h1>${escapeHTML(book.title)}</h1>
          <div class="author">by ${escapeHTML(book.author)}</div>
          <div class="meta-tags">
            <span class="tag">${escapeHTML(book.genre)}</span>
            <span class="tag">Ages ${book.min_age}‑${book.max_age}</span>
          </div>
          <div class="rating-badge">${avg}</div>
          <div class="actions">
            ${book.has_text ? `<a href="read.html?bookId=${book.id}" class="btn btn-primary">📖 Read Now</a>` : ''}
            ${!book.has_text && book.google_books_id ? `<a href="preview.html?bookId=${book.id}" class="btn btn-outline">🔍 Preview</a>` : ''}
          </div>
          ${!book.has_text && !book.google_books_id ? `
            <div class="unavailable-note">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8b5e3c" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
              <div>
                <strong>This book isn’t available to read yet</strong><br>
                <span style="font-size:0.9em;">But you can still discuss, review, and track it!</span>
              </div>
            </div>
          ` : ''}
        </div>
      `;

      // Restore reading status from server
      try {
        const rlRes = await fetch('/api/reading-list');
        const list = await rlRes.json();
        const entry = list.find(b => b.id === parseInt(bookId));
        if (entry) {
          myCurrentStatus = entry.status;
          myProgress = entry.progress || 0;
          myTotal = entry.total_pages || null;
        }
      } catch(e) {}
      updateStatusButtons();
      if (myCurrentStatus === 'currently_reading') {
        document.getElementById('progress-section').style.display = 'flex';
        document.getElementById('pages-read').value = myProgress || '';
        document.getElementById('total-pages').value = myTotal || '';
      }
      loadReviews();
    }

    function updateStatusButtons() {
      document.querySelectorAll('.status-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.status === myCurrentStatus);
      });
    }

    async function setStatus(status) {
      myCurrentStatus = status;
      updateStatusButtons();
      document.getElementById('progress-section').style.display = status === 'currently_reading' ? 'flex' : 'none';
      await fetch(`/api/books/${bookId}/reading-status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
    }

    async function updateProgress() {
      const pagesRead = parseInt(document.getElementById('pages-read').value) || 0;
      const total = parseInt(document.getElementById('total-pages').value) || null;
      await fetch(`/api/books/${bookId}/reading-status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'currently_reading', progress: pagesRead, total_pages: total })
      });
      myProgress = pagesRead;
      myTotal = total;
      alert('Progress updated!');
    }

    async function startTimer() {
      const res = await fetch('/api/reading-sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bookId: parseInt(bookId) })
      });
      const data = await res.json();
      if (data.success) {
        currentSessionId = data.sessionId;
        secondsElapsed = 0;
        document.getElementById('timer-start').disabled = true;
        document.getElementById('timer-pause').disabled = false;
        document.getElementById('timer-stop').disabled = false;
        timerInterval = setInterval(updateTimerDisplay, 1000);
      }
    }

    function updateTimerDisplay() {
      secondsElapsed++;
      const hrs = Math.floor(secondsElapsed / 3600);
      const mins = Math.floor((secondsElapsed % 3600) / 60);
      const secs = secondsElapsed % 60;
      document.getElementById('timer-display').textContent =
        `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      document.getElementById('timer-start').disabled = false;
      document.getElementById('timer-pause').disabled = true;
      document.getElementById('timer-start').textContent = '▶ Resume';
    }

    async function stopTimer() {
      clearInterval(timerInterval);
      document.getElementById('timer-start').disabled = false;
      document.getElementById('timer-start').textContent = '▶ Start';
      document.getElementById('timer-pause').disabled = true;
      document.getElementById('timer-stop').disabled = true;
      await fetch(`/api/reading-sessions/${currentSessionId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ durationSeconds: secondsElapsed, bookId: parseInt(bookId) })
      });
      alert('Reading session saved!');
      secondsElapsed = 0;
      document.getElementById('timer-display').textContent = '00:00:00';
      currentSessionId = null;
    }

    function setRating(r) {
      myRating = r;
      const stars = document.querySelectorAll('.stars span');
      stars.forEach((s, i) => {
        s.textContent = i < r ? '★' : '☆';
        if (i < r) s.classList.add('active');
        else s.classList.remove('active');
      });
    }

    async function submitReview() {
      if (!myRating) return alert('Please select a rating');
      const text = document.getElementById('review-text').value.trim();
      const res = await fetch(`/api/books/${bookId}/review`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ rating: myRating, review_text: text })
      });
      if (res.ok) {
        document.getElementById('review-text').value = '';
        setRating(0);
        loadBook();
        loadReviews();
      } else alert('Failed to submit review');
    }

    async function loadReviews() {
      const res = await fetch(`/api/books/${bookId}/reviews`);
      const reviews = await res.json();
      const container = document.getElementById('reviews-list');
      if (reviews.length === 0) {
        container.innerHTML = '<p style="color:#9b8c7c;">No reviews yet. Be the first!</p>';
        return;
      }
      container.innerHTML = reviews.map(r => `
        <div class="review-card">
          <div class="review-header">
            <div class="review-avatar">${escapeHTML(r.username.charAt(0).toUpperCase())}</div>
            <div>
              <strong>${escapeHTML(r.username)}</strong>
              <div style="color:#f1c40f;">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
            </div>
          </div>
          <div class="review-text">${r.review_text ? escapeHTML(r.review_text) : '<em>No written review</em>'}</div>
          <div class="review-time">${new Date(r.created_at).toLocaleString()}</div>
        </div>
      `).join('');
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    loadBook();
  </script>
</body>
</html>
