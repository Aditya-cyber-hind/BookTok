<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stories - BookTok</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: var(--bg);
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      color: var(--text);
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    h1 {
      color: var(--primary);
      font-size: 2em;
      margin-bottom: 20px;
    }
    .story-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      transition: transform 0.2s;
    }
    .story-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }
    .story-title {
      font-size: 1.3em;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .story-meta {
      font-size: 0.85em;
      color: var(--text-light);
      margin-bottom: 10px;
    }
    .story-excerpt {
      color: var(--text);
      line-height: 1.6;
      white-space: pre-wrap;
      max-height: 120px;
      overflow: hidden;
    }
    .read-more {
      display: inline-block;
      margin-top: 10px;
      background: var(--primary);
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9em;
      cursor: pointer;
      border: none;
    }
    .read-more:hover {
      background: var(--primary-hover, #a47148);
    }

    /* Full story popup */
    .full-story-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .full-story-card {
      background: #faf3e0;
      color: #3a2c1b;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 1.15em;
      line-height: 1.8;
      padding: 40px 50px;
      border-radius: 16px;
      max-width: 700px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
      position: relative;
      white-space: pre-wrap;
    }
    .close-story-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: transparent;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: #8b5e3c;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Feed
    </a>
    <h1>📖 Community Stories</h1>
    <div id="stories-list">
    <div id="stories-list">
  <div class="skeleton" style="height:100px; margin-bottom:12px;"></div>
  <div class="skeleton" style="height:100px; margin-bottom:12px;"></div>
</div>      
    </div>
  </div>

  <!-- Full story popup -->
  <div class="full-story-overlay" id="full-story-overlay" onclick="closeFullStory(event)">
    <div class="full-story-card" id="full-story-content">
      <button class="close-story-btn" onclick="closeFullStory()">✕</button>
      <div id="full-story-text"></div>
    </div>
  </div>

 <script>
    const storyContents = {};

    async function loadStories() {
      const res = await fetch('/api/stories');
      const stories = await res.json();
      const container = document.getElementById('stories-list');
      if (!stories.length) {
        container.innerHTML = '<p>No stories yet. Be the first to <a href="writo.html">write one</a>!</p>';
        return;
      }
      container.innerHTML = stories.map(s => {
        // quote_text holds the full story
        const plainContent = s.quote_text || s.content || '';
        // First sentence as title
        const firstSentence = plainContent.split(/[.\n]/).find(p => p.trim().length > 0)?.trim() || 'Untitled';
        const excerpt = plainContent.length > 200 ? plainContent.substring(0, 200) + '…' : plainContent;
        storyContents[s.id] = plainContent;
        return `
          <div class="story-card">
            <div class="story-title">${escapeHTML(firstSentence)}</div>
            <div class="story-meta">by <a href="profile.html?id=${s.author_id}">${escapeHTML(s.username)}</a> • ${new Date(s.created_at).toLocaleDateString()}</div>
            <div class="story-excerpt">${escapeHTML(excerpt)}</div>
            <button class="read-more" onclick="openFullStory(${s.id})">Read More →</button>
          </div>
        `;
      }).join('');
    }

    function openFullStory(id) {
      const content = storyContents[id] || 'This story appears to be empty.';
      document.getElementById('full-story-text').textContent = content;
      document.getElementById('full-story-overlay').style.display = 'flex';
    }

    function closeFullStory(e) {
      if (e && e.target !== document.getElementById('full-story-overlay')) return;
      document.getElementById('full-story-overlay').style.display = 'none';
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    loadStories();
</script>
</body>
</html>
