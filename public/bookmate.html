<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookMate - Find Your Reading Soulmate</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    h1 {
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 2em;
    }
    .match-card {
      background: var(--bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: fadeInUp 0.5s ease both;
    }
    .match-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .match-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }
    .match-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--accent);
    }
    .match-info {
      flex: 1;
    }
    .match-username {
      font-size: 1.4em;
      font-weight: 700;
      color: var(--primary);
      margin: 0;
    }
    .score-circle {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: conic-gradient(var(--primary) calc(var(--score) * 1%), #ddd 0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2em;
      color: var(--primary);
      position: relative;
    }
    .score-circle::before {
      content: '';
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--bg);
    }
    .score-circle span {
      position: relative;
      z-index: 1;
    }
    .progress-label {
      font-size: 0.85em;
      color: var(--text-light);
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .common-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }
    .common-tag {
      background: var(--accent);
      color: #3a2c1b;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 500;
    }
    .compatibility-note {
      background: #fff8e7;
      border-left: 4px solid #f1c40f;
      padding: 10px 15px;
      border-radius: 8px;
      font-style: italic;
      margin: 15px 0;
      color: #3a2c1b;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover {
      background: var(--primary-hover);
      transform: scale(1.02);
    }
    button:disabled {
      background: #ccc;
      cursor: default;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-light);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Feed
    </a>
    <h1>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8b5e3c" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      BookMate – Your Reading Mate
    </h1>
    <div id="matches-container">
      <div class="loading">Finding your perfect reading partners…</div>
    </div>
  </div>

  <script>
    async function loadBookMate() {
      const container = document.getElementById('matches-container');
      try {
        const res = await fetch('/api/bookmate');
        if (!res.ok) {
          container.innerHTML = '<div class="empty-state">Log in to discover your reading soulmate!</div>';
          return;
        }
        const data = await res.json();
        const matches = data.matches;

        if (!matches || matches.length === 0) {
          container.innerHTML = '<div class="empty-state">Finish some books and like posts to find your match!</div>';
          return;
        }

        container.innerHTML = matches.map((match, index) => {
          const scorePercent = Math.round(match.score);
          const avatarURL = `https://api.dicebear.com/9.x/adventurer/svg?seed=${encodeURIComponent(match.username)}`;
          const commonItems = [...(match.commonGenres || []), ...(match.commonTags || [])].slice(0, 5);
          const isTop = index === 0;

          return `
            <div class="match-card" style="animation-delay: ${index * 0.15}s;">
              <div class="match-header">
                <img class="match-avatar" src="${avatarURL}" alt="${escapeHTML(match.username)}">
                <div class="match-info">
                  <h2 class="match-username">${escapeHTML(match.username)}</h2>
                  <div class="progress-label">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b5e3c" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    ${scorePercent}% Compatible
                  </div>
                </div>
                <div class="score-circle" style="--score: ${scorePercent};">
                  <span>${scorePercent}%</span>
                </div>
              </div>

              <div class="common-list">
                ${commonItems.map(item => `<span class="common-tag">${escapeHTML(item)}</span>`).join('')}
              </div>

              ${isTop && match.compatibilityNote ? `
                <div class="compatibility-note">
                  💬 ${escapeHTML(match.compatibilityNote)}
                </div>
              ` : ''}

              <button onclick="sendFriendRequest(${match.userId}, '${escapeHTML(match.username)}', this)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                Connect
              </button>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = '<div class="empty-state">Something went wrong. Try again later.</div>';
      }
    }

    async function sendFriendRequest(userId, username, button) {
      button.disabled = true;
      button.textContent = 'Request sent!';
      try {
        const res = await fetch('/api/friend-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to_username: username })
        });
        if (res.ok) {
          button.style.background = '#6b8e23';
        } else {
          const data = await res.json();
          button.textContent = 'Error';
          alert(data.error || 'Failed');
        }
      } catch(e) {
        button.textContent = 'Error';
      }
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    loadBookMate();
  </script>
</body>
</html>
