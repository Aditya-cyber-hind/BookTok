<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Communities - BookTok</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background: var(--bg); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; color: var(--text); }
    .container { max-width: 750px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: var(--card-bg); }
    .header { background: var(--primary); color: white; padding: 15px 20px; display: flex; align-items: center; gap: 12px; }
    .header a, .header button { color: white; text-decoration: none; background: none; border: none; cursor: pointer; font-size: 1em; }
    .header h2 { margin: 0; font-size: 1.1em; flex: 1; }
    .community-list { padding: 15px; overflow-y: auto; }
    .community-item { display: flex; align-items: center; gap: 12px; padding: 15px; cursor: pointer; border-radius: 12px; transition: background 0.2s; margin-bottom: 8px; background: var(--bg); border: 1px solid var(--border); }
    .community-item:hover { border-color: var(--primary); }
    .community-icon { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5em; }
    .community-info h3 { margin: 0; font-size: 1em; color: var(--text); }
    .community-info p { margin: 3px 0 0; font-size: 0.8em; color: var(--text-light); }
    .chat-area { display: none; flex: 1; flex-direction: column; }
    .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: var(--bg); }
    .msg { display: flex; gap: 10px; align-items: flex-start; animation: fadeIn 0.3s ease; }
    .msg-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9em; flex-shrink: 0; color: white; }
    .msg-content { flex: 1; }
    .msg-username { font-size: 0.75em; font-weight: 700; color: var(--primary); margin-bottom: 2px; }
    .msg-text { background: var(--card-bg); padding: 10px 14px; border-radius: 14px; line-height: 1.4; display: inline-block; max-width: 90%; word-wrap: break-word; }
    .msg.own .msg-text { background: var(--primary); color: white; }
    .msg-time { font-size: 0.65em; color: var(--text-light); margin-top: 3px; margin-left: 4px; }
    .msg.own { flex-direction: row-reverse; }
    .msg.own .msg-username { text-align: right; }
    .msg.own .msg-text { border-bottom-right-radius: 4px; }
    .msg:not(.own) .msg-text { border-bottom-left-radius: 4px; }
    .input-area { display: flex; gap: 8px; padding: 12px 15px; border-top: 1px solid var(--border); background: var(--card-bg); }
    .input-area input { flex: 1; padding: 10px 16px; border-radius: 25px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    .input-area button { background: var(--primary); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.2em; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html" class="back-btn-main">←</a>
      <button id="back-btn" style="display:none;" onclick="goBack()">←</button>
      <h2 id="header-title">📚 Book Communities</h2>
    </div>

    <div class="community-list" id="community-list"></div>

    <div class="chat-area" id="chat-area">
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <input type="text" id="message-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let currentCommunity = null;
    let socket = null;

    async function init() {
      const me = await fetch('/api/me');
      if (!me.ok) { window.location.href = 'index.html'; return; }
      currentUser = await me.json();
      
      socket = io();
      socket.on('community-message', (msg) => {
        if (currentCommunity && msg.community === currentCommunity.id) {
          appendMessage(msg);
        }
      });
      
      loadCommunities();
    }

    async function loadCommunities() {
      const res = await fetch('/api/communities');
      const communities = await res.json();
      const container = document.getElementById('community-list');
      
      const colors = ['#8b5e3c', '#6b8e23', '#e74c3c', '#3498db', '#9b59b6', '#e67e22', '#1abc9c'];
      
      container.innerHTML = communities.map((c, i) => `
        <div class="community-item" onclick="openCommunity('${c.id}', '${c.name}', '${c.emoji}')">
          <div class="community-icon" style="background:${colors[i]};">${c.emoji}</div>
          <div class="community-info">
            <h3>${c.name}</h3>
            <p>${c.desc}</p>
          </div>
        </div>
      `).join('');
    }

    async function openCommunity(id, name, emoji) {
      currentCommunity = { id, name, emoji };
      document.getElementById('community-list').style.display = 'none';
      document.getElementById('chat-area').style.display = 'flex';
      document.getElementById('header-title').textContent = `${emoji} ${name}`;
      document.getElementById('back-btn').style.display = 'inline';
      document.querySelector('.back-btn-main').style.display = 'none';
      
      const res = await fetch(`/api/communities/${id}/messages`);
      const messages = await res.json();
      document.getElementById('messages').innerHTML = '';
      messages.forEach(m => appendMessage(m));
      
      socket.emit('join-community', id);
    }

    function goBack() {
      currentCommunity = null;
      document.getElementById('community-list').style.display = 'block';
      document.getElementById('chat-area').style.display = 'none';
      document.getElementById('header-title').textContent = '📚 Book Communities';
      document.getElementById('back-btn').style.display = 'none';
      document.querySelector('.back-btn-main').style.display = 'inline';
      socket.emit('leave-community');
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const content = input.value.trim();
      if (!content || !currentCommunity) return;
      
      const res = await fetch(`/api/communities/${currentCommunity.id}/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });
      const msg = await res.json();
      
      socket.emit('community-message', msg);
      
      input.value = '';
    }

    function appendMessage(msg) {
      const container = document.getElementById('messages');
      const isOwn = msg.user_id === currentUser.id;
      const avatarColors = ['#8b5e3c', '#6b8e23', '#e74c3c', '#3498db', '#9b59b6', '#e67e22', '#1abc9c', '#f39c12', '#2ecc71'];
      const colorIndex = (msg.username || '?').charCodeAt(0) % avatarColors.length;
      
      const div = document.createElement('div');
      div.className = `msg${isOwn ? ' own' : ''}`;
      div.innerHTML = `
        <div class="msg-avatar" style="background:${avatarColors[colorIndex]};">${(msg.username || '?')[0].toUpperCase()}</div>
        <div class="msg-content">
          <div class="msg-username">${escapeHTML(msg.username || 'Unknown')}</div>
          <div class="msg-text">${escapeHTML(msg.content)}</div>
          <span class="msg-time">${new Date(msg.sent_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true})}</span>
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    init();
  </script>
</body>
</html>
