<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess the Book - BookTok</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
    .confetti-piece { position: absolute; width: 12px; height: 12px; border-radius: 3px; animation: confettiFall 3s ease-out forwards; }
    @keyframes confettiFall { 0% { transform: translateY(-100px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
    .pop-in { animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
    .shake { animation: shake 0.5s ease; }
    body { background: var(--bg); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .game-container { max-width: 600px; width: 90%; background: var(--card-bg); border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-weight: 600; font-size: 0.9em; }
    h1 { color: var(--primary); font-size: 2em; margin-bottom: 5px; }
    .subtitle { color: var(--text-light); margin-bottom: 25px; font-size: 0.95em; }
    .hint-box { background: linear-gradient(135deg, #faf3e0, #f0e4ce); border-radius: 16px; padding: 25px 20px; margin: 20px 0; border: 2px solid var(--accent); min-height: 80px; display: flex; align-items: center; justify-content: center; }
    .hint-text { font-size: 1.2em; font-style: italic; color: #5a3e28; line-height: 1.6; }
    .hint-counter { color: var(--text-light); font-size: 0.85em; margin-bottom: 15px; }
    .hint-counter span { color: var(--primary); font-weight: 700; font-size: 1.1em; }
    .guess-area { display: flex; gap: 10px; margin: 15px 0; }
    .guess-area input { flex: 1; padding: 12px 18px; border-radius: 25px; border: 2px solid var(--border); background: var(--bg); color: var(--text); font-size: 1em; }
    .guess-area input:focus { border-color: var(--primary); outline: none; }
    .btn { padding: 10px 24px; border-radius: 25px; font-weight: 600; border: none; cursor: pointer; font-size: 0.9em; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover, #a47148); transform: translateY(-1px); }
    .btn-secondary { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
    .btn-accent { background: var(--accent); color: #3a2c1b; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .result-box { display: none; padding: 20px; border-radius: 14px; margin-top: 15px; }
    .result-box.win { display: block; background: #d4edda; border: 2px solid #28a745; color: #155724; }
    .result-box.lose { display: block; background: #f8d7da; border: 2px solid #dc3545; color: #721c24; }
    .result-emoji { font-size: 3em; margin-bottom: 10px; }
    .badge-earned { display: inline-block; background: gold; color: #333; padding: 6px 16px; border-radius: 20px; font-weight: 700; margin-top: 10px; animation: bounce 0.6s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  </style>
</head>
<body>
  <div class="game-container">
    <a href="index.html" class="back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Feed
    </a>
    <h1>📖 Guess the Book</h1>
    <p class="subtitle">AI gives you hints — can you name the book?</p>

    <div class="hint-box" id="hint-box">
      <div class="hint-text" id="hint-text">Loading your first hint...</div>
    </div>

    <div class="hint-counter">Hints used: <span id="hints-used">0</span> / <span>15</span></div>

    <div class="guess-area" id="guess-area">
      <input type="text" id="guess-input" placeholder="Type the book title..." onkeypress="if(event.key==='Enter')makeGuess()">
      <button class="btn btn-primary" onclick="makeGuess()">Guess</button>
    </div>

    <button class="btn btn-secondary" id="next-hint-btn" onclick="nextHint()">💡 Next Hint</button>

    <div class="result-box" id="result-box"></div>
  </div>

  <script>
    let currentBook = null;
    let hintsUsed = 0;
    let gameOver = false;
    let hintHistory = [];

    function spawnConfetti() {
      const container = document.createElement('div');
      container.className = 'confetti-container';
      document.body.appendChild(container);
      
      const colors = ['#f1c40f', '#e74c3c', '#2ecc71', '#3498db', '#9b59b6', '#e67e22', '#1abc9c', '#f39c12'];
      
      for (let i = 0; i < 100; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.top = -(Math.random() * 20) + 'px';
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = Math.random() * 0.5 + 's';
        piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
        piece.style.width = (Math.random() * 10 + 8) + 'px';
        piece.style.height = (Math.random() * 10 + 8) + 'px';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
        container.appendChild(piece);
      }
      
      setTimeout(() => container.remove(), 3500);
    }

    async function startNewGame() {
      gameOver = false;
      hintsUsed = 0;
      hintHistory = [];
      document.getElementById('hints-used').textContent = '0';
      document.getElementById('guess-input').value = '';
      document.getElementById('guess-input').disabled = false;
      document.getElementById('next-hint-btn').disabled = false;
      document.getElementById('guess-area').style.display = 'flex';
      document.getElementById('result-box').style.display = 'none';
      document.getElementById('result-box').className = 'result-box';
      document.getElementById('hint-text').textContent = 'Loading your first hint...';

      try {
        const res = await fetch('/api/game/guess-book/start', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          currentBook = data;
          hintHistory.push(data.firstHint);
          document.getElementById('hint-text').textContent = data.firstHint;
        } else {
          document.getElementById('hint-text').textContent = 'Could not start game. Try again!';
        }
      } catch(e) {
        document.getElementById('hint-text').textContent = 'Error starting game. Is the server running?';
      }
    }

    async function nextHint() {
      if (gameOver || hintsUsed >= 14) return;
      
      document.getElementById('hint-text').textContent = 'Loading hint...';
      
      try {
        const res = await fetch('/api/game/guess-book/hint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            book: currentBook.bookTitle, 
            author: currentBook.bookAuthor,
            previousHints: hintHistory 
          })
        });
        const data = await res.json();
        if (data.hint) {
          hintsUsed++;
          hintHistory.push(data.hint);
          document.getElementById('hints-used').textContent = hintsUsed;
          document.getElementById('hint-text').textContent = data.hint;
          
          if (hintsUsed >= 14) {
            document.getElementById('next-hint-btn').disabled = true;
          }
        }
      } catch(e) {
        document.getElementById('hint-text').textContent = 'Error loading hint.';
      }
    }

    async function makeGuess() {
      if (gameOver) return;
      
      const guess = document.getElementById('guess-input').value.trim();
      if (!guess) return;

      const res = await fetch('/api/game/guess-book/guess', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          guess, 
          bookTitle: currentBook.bookTitle,
          bookAuthor: currentBook.bookAuthor,
          hintsUsed: hintsUsed + 1 
        })
      });
      const data = await res.json();

      const resultBox = document.getElementById('result-box');
      const guessInput = document.getElementById('guess-input');
      
      if (data.correct) {
        gameOver = true;
        spawnConfetti();
        resultBox.className = 'result-box win pop-in';
        resultBox.innerHTML = `
          <div class="result-emoji">🎉</div>
          <h2>You Win!</h2>
          <p style="font-size:1.2em;">It's <strong>"${escapeHTML(currentBook.bookTitle)}"</strong> by ${escapeHTML(currentBook.bookAuthor)}!</p>
          <p>Solved in ${hintsUsed + 1} hint${hintsUsed === 0 ? '' : 's'}! 🎯</p>
          ${data.badgeEarned ? `<div class="badge-earned pop-in">🏅 ${data.badgeEarned}</div>` : ''}
          <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
            <button class="btn btn-primary" onclick="startNewGame()">🔄 Play Again</button>
            <button class="btn btn-secondary" onclick="window.location.href='activities.html'">🏠 Quit</button>
          </div>
        `;
        guessInput.disabled = true;
        document.getElementById('next-hint-btn').disabled = true;
        document.getElementById('guess-area').style.display = 'none';
      } else if (hintsUsed >= 14) {
        gameOver = true;
        resultBox.className = 'result-box lose shake';
        resultBox.innerHTML = `
          <div class="result-emoji">😢</div>
          <h2>Out of Hints!</h2>
          <p>The book was <strong>"${escapeHTML(currentBook.bookTitle)}"</strong> by ${escapeHTML(currentBook.bookAuthor)}.</p>
          <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
            <button class="btn btn-primary" onclick="startNewGame()">🔄 Try Again</button>
            <button class="btn btn-secondary" onclick="window.location.href='activities.html'">🏠 Quit</button>
          </div>
        `;
        guessInput.disabled = true;
        document.getElementById('next-hint-btn').disabled = true;
        document.getElementById('guess-area').style.display = 'none';
      } else {
        hintsUsed++;
        document.getElementById('hints-used').textContent = hintsUsed;
        guessInput.value = '';
        guessInput.classList.add('shake');
        setTimeout(() => guessInput.classList.remove('shake'), 500);
        resultBox.className = 'result-box lose';
        resultBox.style.display = 'block';
        resultBox.innerHTML = `<p>❌ Not quite! <strong>${hintsUsed}</strong> hint${hintsUsed === 1 ? '' : 's'} used. Try again or get another hint!</p>`;
        setTimeout(() => { resultBox.style.display = 'none'; }, 2500);
      }
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    startNewGame();
  </script>
</body>
</html>
